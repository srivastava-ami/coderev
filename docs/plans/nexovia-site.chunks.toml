# nexovia-site — ordered chunks. One function/resource group per chunk; tests in the same chunk.
# Target repo: nex-ovia/infraflow-nex-ovia-site (branch dev today; becomes main after cutover).
# Pulled on demand via coderev project_manifest.toml [pull].site_plan_chunks.

# ---------- U: one-time user actions (cannot be automated from here) ----------
[[chunk]]
id = "U1"
who = "user"
do = "Cloudflare API token, scoped to zone nex-ovia.com + account: Zone:DNS Edit, Zone:Zone Settings Edit, Zone:Single Redirect/Rulesets Edit, Zone:Bot Management Edit, Account:Cloudflare Pages Edit, Account:Web Analytics Edit. Set a 1-year expiry."
validate = "token verify endpoint returns active (run by pipeline)"

[[chunk]]
id = "U2"
who = "user"
do = "R2 bucket nexovia-tfstate (free 10 GB) + R2 S3 API token scoped to that bucket only"
validate = "terraform init against backend succeeds in CI"

[[chunk]]
id = "U3"
who = "user"
do = "GitHub repo secrets CLOUDFLARE_API_TOKEN, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY; environment 'production' with you as required reviewer (free on public repos)"
validate = "infra workflow plan job reads secrets without error"

[[chunk]]
id = "U4"
who = "user"
do = "Grant this session push access to nex-ovia/infraflow-nex-ovia-site"
validate = "git push to a work branch succeeds"

# ---------- I: Terraform (infra/) ----------
[[chunk]]
id = "I01"
model = "haiku"
do = "versions.tf + backend.tf: terraform >= 1.10, cloudflare provider pinned ~> 5 (exact minor at build time), S3 backend on R2 with use_lockfile; workflow concurrency group as a second lock"
test = "terraform init -backend=false && terraform validate"

[[chunk]]
id = "I02"
model = "haiku"
do = "variables.tf + env/prod.tfvars: account_id, zone_id, apex, hostnames, ai_crawler_policy. No secrets in tfvars; validation blocks on every variable"
test = "terraform validate; tfvars contain no token-like strings (gitleaks)"

[[chunk]]
id = "I03"
model = "haiku"
do = "Go tool tools/cfimport: list existing DNS records via API → import.tf with import blocks so Terraform adopts, never recreates (www, apex, genome/nx-viz CNAMEs, MX/TXT)"
test = "go test ./tools/cfimport (recorded API fixture); terraform plan shows 0 destroy"

[[chunk]]
id = "I04"
model = "haiku"
do = "pages.tf: cloudflare_pages_project (direct upload, production_branch main) + custom domains www and apex"
test = "terraform test (mock_provider): project + 2 domains present"

[[chunk]]
id = "I05"
model = "haiku"
do = "security.tf: SSL strict, min TLS 1.2, TLS 1.3 on, Always HTTPS, HSTS (max-age 1y, includeSubDomains, preload after 30 days), DNSSEC, CAA (letsencrypt, pki.goog, digicert only), free managed WAF ruleset on"
test = "terraform test asserts each setting value"

[[chunk]]
id = "I06"
model = "haiku"
do = "rules.tf: single redirect apex → https://www, rate-limit rule (free tier: 1 rule) on /*, block non-GET/HEAD methods (static site)"
test = "terraform test asserts redirect + rule expressions"

[[chunk]]
id = "I07"
model = "haiku"
do = "bots.tf: disable Cloudflare-managed robots.txt and AI-bot block (site ships its own robots.txt), keep Bot Fight Mode off so verified search/AI bots aren't challenged. If provider lacks an attribute, record it as a documented dashboard step"
test = "terraform test; curl robots.txt in C01 matches site copy"

[[chunk]]
id = "I08"
model = "haiku"
do = "analytics.tf: cloudflare_web_analytics_site (free, cookieless) → token output consumed by site build"
test = "terraform validate; output non-empty in plan"

[[chunk]]
id = "I09"
model = "main"
do = "tests/: terraform test suite + tflint + checkov config; plan guard fails if any destroy hits DNS or the Pages project"
test = "terraform test && tflint && checkov -d infra → 0 failed"

# ---------- S: site build (Go tool tools/nxsite) ----------
[[chunk]]
id = "S01"
model = "haiku"
do = "nxsite.Load: content/*.toml pages + content/blog/*.md with front matter {title, date, summary, tags, image, social{linkedin,x,instagram}}"
test = "go test ./tools/nxsite -run TestLoad"

[[chunk]]
id = "S02"
model = "haiku"
do = "nxsite.RenderLayout: server-render nav/footer into every page (removes JS injection so crawlers see links); fix /sponser → /sponsor"
test = "TestNavInRawHTML"

[[chunk]]
id = "S03"
model = "haiku"
do = "nxsite.Head: title, description, canonical (https://www…), og:*, twitter:card, JSON-LD (Organization, Person, WebSite, SoftwareApplication per tool, BlogPosting per post)"
test = "TestHeadTagsAndJSONLDValid"

[[chunk]]
id = "S04"
model = "haiku"
do = "nxsite.Feeds: sitemap.xml (lastmod), robots.txt (allow search + AI bots per policy, link sitemap), feed.xml (Atom), llms.txt"
test = "TestSitemapAndFeedValidXML"

[[chunk]]
id = "S05"
model = "haiku"
do = "nxsite.Blog: markdown → /blog/<slug>/ + /blog index with tags. Adds dependency github.com/yuin/goldmark (pure Go, MIT)"
test = "TestBlogRenderAndIndex"

[[chunk]]
id = "S06"
model = "haiku"
do = "nxsite.Headers: _headers (CSP without unsafe-inline, X-Content-Type-Options, Referrer-Policy, Permissions-Policy, immutable cache for hashed assets), _redirects, custom 404.html"
test = "TestHeadersFileHasCSP"

[[chunk]]
id = "S07"
model = "haiku"
do = "nxsite.Card: per-post images in brand style, 1200×630 (OG/LinkedIn/X) and 1080×1350 (Instagram), with Go image/draw and embedded font"
test = "TestCardSizes"

[[chunk]]
id = "S08"
model = "main"
do = "nxsite check: internal link checker + every page has exactly 1 h1, a canonical and a description"
test = "nxsite check dist/ → 0 errors"

# ---------- P: pipelines (.github/workflows) ----------
[[chunk]]
id = "P01"
model = "main"
do = "infra.yml: PR → fmt -check, validate, tflint, checkov, terraform test, plan as PR comment. Push to main → apply in environment 'production' (manual approval). Concurrency group tf-prod"
test = "actionlint; dry run on a PR"

[[chunk]]
id = "P02"
model = "main"
do = "site.yml: build nxsite → check → wrangler pages deploy (PR = preview URL, main = production); wrangler version pinned"
test = "actionlint; preview URL returns 200"

[[chunk]]
id = "P03"
model = "haiku"
do = "hardening: actions pinned by commit SHA, top-level permissions read-only, per-job least privilege, Dependabot for actions + gomod, gitleaks on PR"
test = "actionlint + zizmor (workflow security linter) → 0 high"

# ---------- X: social syndication (LinkedIn, X, Instagram) ----------
[[chunk]]
id = "X01"
model = "haiku"
do = "tools/nxsocial drafts: from front matter → LinkedIn post (≤3000 chars + link), X post/thread (≤280 each + link), Instagram caption (≤2200, link in bio note) + S07 image. Always produced as a workflow artifact"
test = "go test ./tools/nxsocial -run TestDraftLimits"

[[chunk]]
id = "X02"
model = "haiku"
do = "LinkedIn publish (opt-in): Posts API with w_member_social (free 'Share on LinkedIn' product). 60-day token, re-auth reminder issue opened 7 days before expiry"
test = "TestLinkedInRequestShape (httptest)"

[[chunk]]
id = "X03"
model = "haiku"
do = "X publish (opt-in): API v2 create post on the free tier (write-only, low monthly cap); thread support; skip when the cap is hit"
test = "TestXThreadRequests (httptest)"

[[chunk]]
id = "X04"
model = "haiku"
do = "Instagram publish (opt-in): Graph API content publishing. Needs a Business/Creator account linked to a Facebook Page; posts the S07 image from its public URL with the caption"
test = "TestInstagramTwoStepPublish (httptest)"

[[chunk]]
id = "X05"
model = "main"
do = "social.yml: after a production deploy, for each new post build drafts; publish only platforms where front matter social.<p>=auto and the secret exists; write status back via PR"
test = "dry-run on a fixture post → 3 drafts, 0 API calls"

# ---------- C: cutover ----------
[[chunk]]
id = "C01"
model = "main"
do = "verify on <project>.pages.dev: Playwright at 390/1280px, raw-HTML SEO tags, security headers, robots/sitemap/feed, 0 broken links"
test = "verification script exit 0"

[[chunk]]
id = "C02"
model = "main"
do = "DNS switch via terraform apply (www + apex → Pages). Azure SWA stays live 7 days for rollback (revert = re-apply previous commit)"
test = "www + apex serve the Cloudflare build; redirect apex→www 301"

[[chunk]]
id = "C03"
model = "haiku"
do = "Search Console + Bing Webmaster TXT verification records via Terraform; you submit the sitemap in both"
test = "TXT records resolve"

[[chunk]]
id = "C04"
who = "user"
do = "after 7 clean days: delete the Azure SWA resource, remove azure-static-web-apps.yml, make main the default branch"
validate = "no Azure references in repo; Azure cost $0"
